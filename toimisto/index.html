<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Toimistohiippailu</title>
    <style>
        body { background: #1e1e2e; color: #cdd6f4; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 15px; }
        canvas { background: #f4f1ea; border: 4px solid #45475a; border-radius: 8px; }
        #ui { width: 800px; display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
        .controls { margin-top: 8px; font-size: 14px; color: #a6adc8; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="taskText">Tehtävä: Nouda tilaus ULKO-OVELTA</div>
        <div id="roomStatus">Koillishuone: LOUNASTILA</div>
        <div id="scoreText">Pisteet: 0</div>
    </div>
    <canvas id="gameCanvas" width="800" height="520"></canvas>
    <div class="controls">Liiku: WASD / Nuolet | Hiivi: SHIFT | Uudelleen: R</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let score = 0, gameOver = false, task = 'DOOR', waitProgress = 0, roomTimer = 0, isMeeting = false;
const WAIT_TIME = 90, ROOM_CYCLE = 650;
const player = { x: 205, y: 160, radius: 11, speed: 3, sneaking: false };

const walls = [
    { x: 120, y: 50, w: 560, h: 10 }, { x: 120, y: 50, w: 10, h: 155 }, { x: 120, y: 285, w: 10, h: 125 },
    { x: 670, y: 50, w: 10, h: 360 }, { x: 120, y: 400, w: 300, h: 10 }, { x: 490, y: 400, w: 190, h: 10 },
    { x: 55, y: 195, w: 75, h: 10 }, { x: 55, y: 285, w: 75, h: 10 }, { x: 55, y: 195, w: 10, h: 100 },
    { x: 420, y: 400, w: 10, h: 75 }, { x: 490, y: 400, w: 10, h: 75 }, { x: 420, y: 465, w: 80, h: 10 },
    { x: 515, y: 50, w: 10, h: 155 }, { x: 515, y: 195, w: 45, h: 10 }, { x: 620, y: 195, w: 60, h: 10 }
];

const desks = [
    { x: 155, y: 75, w: 55, h: 32 }, { x: 225, y: 75, w: 55, h: 32 }, { x: 295, y: 75, w: 55, h: 32 },
    { x: 365, y: 75, w: 55, h: 32 }, { x: 435, y: 75, w: 55, h: 32 },
    { x: 145, y: 135, w: 35, h: 50 }, { x: 145, y: 310, w: 35, h: 50 },
    { x: 210, y: 350, w: 65, h: 32 }, { x: 310, y: 350, w: 65, h: 32 }, { x: 535, y: 350, w: 65, h: 32 },
    { x: 550, y: 95, w: 95, h: 45, isMeetingTable: true }
];

const zones = {
    desk: { x: 185, y: 138, w: 40, h: 44, color: '#89b4fa', label: 'OMA' },
    production: { x: 68, y: 208, w: 50, h: 74, color: '#cba6f7', label: 'TUOTANTO' },
    door: { x: 432, y: 415, w: 56, h: 48, color: '#f9e2af', label: 'ULKO-OVI' },
    printer: { x: 440, y: 115, w: 50, h: 38, color: '#fab387', label: 'TULOSTIN' },
    lunch: { x: 525, y: 60, w: 145, h: 135, color: '#a6e3a1', label: 'LOUNAS / PALAVERI' }
};
const npcs = [
    { name: 'Johtaja (M)', x: 350, y: 215, vx: 2.2, vy: 0, minX: 150, maxX: 640, color: '#f38ba8', viewDist: 105, angle: 0 },
    { name: 'Assistentti (N)', x: 520, y: 295, vx: -1.8, vy: 0, minX: 210, maxX: 640, color: '#cba6f7', viewDist: 95, angle: Math.PI },
    { name: 'Tuotanto (M)', x: 245, y: 245, vx: 0, vy: 1.6, minY: 160, maxY: 325, color: '#94e2d5', viewDist: 85, angle: Math.PI/2 }
];

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function rectCircleColliding(c, r) {
    let dx = Math.abs(c.x - r.x - r.w / 2), dy = Math.abs(c.y - r.y - r.h / 2);
    if (dx > r.w / 2 + c.radius || dy > r.h / 2 + c.radius) return false;
    if (dx <= r.w / 2 || dy <= r.h / 2) return true;
    return ((dx - r.w / 2) ** 2 + (dy - r.h / 2) ** 2 <= c.radius ** 2);
}

function isInsideZone(p, z) { return p.x > z.x && p.x < z.x + z.w && p.y > z.y && p.y < z.y + z.h; }

function update() {
    if (gameOver) { if (keys['r']) location.reload(); return; }
    if (++roomTimer >= ROOM_CYCLE) {
        roomTimer = 0; isMeeting = !isMeeting;
        const el = document.getElementById('roomStatus');
        el.textContent = isMeeting ? 'Koillishuone: PALAVERI!' : 'Koillishuone: LOUNASTILA';
        el.style.color = isMeeting ? '#f38ba8' : '#a6e3a1';
    }
    if (isMeeting && isInsideZone(player, zones.lunch)) endGame('Kävelit sisään kesken palaverin!');

    player.sneaking = keys['shift'];
    let speed = player.sneaking ? 1.5 : player.speed, nx = player.x, ny = player.y;
    if (keys['w'] || keys['arrowup']) ny -= speed;
    if (keys['s'] || keys['arrowdown']) ny += speed;
    if (keys['a'] || keys['arrowleft']) nx -= speed;
    if (keys['d'] || keys['arrowright']) nx += speed;

    if (![...walls, ...desks].some(obj => rectCircleColliding({ x: nx, y: ny, radius: player.radius }, obj))) {
        player.x = nx; player.y = ny;
    }

    const taskEl = document.getElementById('taskText');
    if (task === 'DOOR' && isInsideZone(player, zones.door) && ++waitProgress >= WAIT_TIME) {
        task = 'PRINTER'; waitProgress = 0; taskEl.textContent = 'Tehtävä: Tulosta tilaus (TULOSTIN)';
    } else if (task === 'PRINTER' && isInsideZone(player, zones.printer) && ++waitProgress >= WAIT_TIME) {
        task = 'PROD'; waitProgress = 0; taskEl.textContent = 'Tehtävä: Vie tilaus TUOTANTOON (vasen)';
    } else if (task === 'PROD' && isInsideZone(player, zones.production) && ++waitProgress >= WAIT_TIME) {
        task = 'LUNCH'; waitProgress = 0; taskEl.textContent = 'Tehtävä: Käy lounaalla (koillinen, kun vapaa)';
    } else if (task === 'LUNCH' && isInsideZone(player, zones.lunch) && !isMeeting && ++waitProgress >= WAIT_TIME) {
        task = 'DESK'; waitProgress = 0; taskEl.textContent = 'Tehtävä: Palaa omalle paikalle (OMA)';
    } else if (task === 'DESK' && isInsideZone(player, zones.desk)) {
        score += 200; document.getElementById('scoreText').textContent = 'Pisteet: ' + score;
        task = 'DOOR'; taskEl.textContent = 'Uusi lähetys! Nouda tilaus ULKO-OVELTA';
    } else if (!['DOOR','PRINTER','PROD','LUNCH'].some(t => task === t)) {
        waitProgress = 0;
    }

    for (let npc of npcs) {
        npc.x += npc.vx; npc.y += npc.vy;
        if (npc.vx && (npc.x > npc.maxX || npc.x < npc.minX)) { npc.vx *= -1; npc.angle = npc.vx > 0 ? 0 : Math.PI; }
        if (npc.vy && (npc.y > npc.maxY || npc.y < npc.minY)) { npc.vy *= -1; npc.angle = npc.vy > 0 ? Math.PI/2 : -Math.PI/2; }
        let dx = player.x - npc.x, dy = player.y - npc.y, dist = Math.hypot(dx, dy);
        let view = player.sneaking ? npc.viewDist * 0.6 : npc.viewDist;
        if (dist < view) {
            let diff = Math.abs(Math.atan2(dy, dx) - npc.angle);
            if (diff > Math.PI) diff = 2 * Math.PI - diff;
            if (diff < 0.42) endGame(npc.name + ' pysäytti sinut keskikäytävällä!');
        }
    }
}

function endGame(reason) {
    gameOver = true;
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f38ba8'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('JÄIT KIINNI!', canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif';
    ctx.fillText(reason, canvas.width / 2, canvas.height / 2 + 20);
    ctx.fillText('Paina R-näppäintä yrittääksesi uudelleen', canvas.width / 2, canvas.height / 2 + 60);
}

function draw() {
    if (gameOver) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let key of ['desk', 'production', 'door', 'printer', 'lunch']) {
        let z = zones[key];
        ctx.fillStyle = (key === 'lunch' && isMeeting) ? '#f38ba8' : z.color;
        ctx.fillRect(z.x, z.y, z.w, z.h);
        ctx.fillStyle = '#1e1e2e'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(z.label, z.x + z.w / 2, z.y + z.h / 2 + 4);
    }

    ctx.fillStyle = '#313244';
    for (let w of walls) ctx.fillRect(w.x, w.y, w.w, w.h);

    for (let d of desks) {
        ctx.fillStyle = d.isMeetingTable ? '#7f849c' : '#b48ead';
        ctx.fillRect(d.x, d.y, d.w, d.h);
        ctx.strokeStyle = '#313244'; ctx.strokeRect(d.x, d.y, d.w, d.h);
        if (!d.isMeetingTable) {
            ctx.fillStyle = '#89dceb';
            ctx.fillRect(d.x + 10, d.y + 8, 14, 9);
            ctx.fillRect(d.x + 30, d.y + 8, 14, 9);
        }
    }

    for (let npc of npcs) {
        ctx.beginPath(); ctx.moveTo(npc.x, npc.y);
        let view = player.sneaking ? npc.viewDist * 0.6 : npc.viewDist;
        ctx.arc(npc.x, npc.y, view, npc.angle - 0.42, npc.angle + 0.42); ctx.closePath();
        ctx.fillStyle = 'rgba(243, 139, 168, 0.3)'; ctx.fill();
        ctx.beginPath(); ctx.arc(npc.x, npc.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = npc.color; ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#1e1e2e'; ctx.font = '11px sans-serif'; ctx.fillText(npc.name, npc.x, npc.y - 16);
    }

    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.sneaking ? '#45475a' : '#1e66f5'; ctx.fill();

    if (waitProgress > 0) {
        ctx.fillStyle = '#1e1e2e'; ctx.fillRect(player.x - 20, player.y - 24, 40, 6);
        ctx.fillStyle = '#a6e3a1'; ctx.fillRect(player.x - 20, player.y - 24, 40 * (waitProgress / WAIT_TIME), 6);
    }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
